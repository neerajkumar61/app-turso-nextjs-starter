version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_TURSO_DB_URL: ${NEXT_TURSO_DB_URL}
        NEXT_TURSO_DB_AUTH_TOKEN: ${NEXT_TURSO_DB_AUTH_TOKEN}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TURSO_DB_URL=${NEXT_TURSO_DB_URL}
      - NEXT_TURSO_DB_AUTH_TOKEN=${NEXT_TURSO_DB_AUTH_TOKEN}
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TURSO_DB_URL=${NEXT_TURSO_DB_URL}
      - NEXT_TURSO_DB_AUTH_TOKEN=${NEXT_TURSO_DB_AUTH_TOKEN}
    env_file:
      - .env.local
    command: npm run dev
    profiles:
      - dev